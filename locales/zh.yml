  rag-text-chunker:
    title: RAG 文本分块器
    description: 按语义边界把文档切成可直接嵌入的块，支持重叠窗口与逐块 Token 估算。
    usage:
      what: '把长文档切成可直接做向量化的块，并逐块预览切分边界落在哪里。'
      step1: '粘贴文档，在右侧设置单块最大字符数和重叠字符数。'
      step2: '在下方逐块预览，确认没有把一个完整语义单元从中间切断。'
      step3: '点「复制 JSONL」，拿到带 id 和 source 的嵌入输入文件。'
      tip: '切分优先级是 段落 → 换行 → 中英文句末 → 空格 → 硬切。重叠一般取单块的 10%~15%，作用是让跨边界的句子在相邻两块里都能被检索到。'
