  llm-token-cost-calculator:
    title: LLM Token 与成本计算器
    description: 在本地估算 Prompt Token、缓存输入节省、输出成本和上下文窗口占用。
    usage:
      what: '在真正发请求之前，先估算一段 Prompt 的 Token 数和调用成本，让"这个用法规模化后是否烧钱"在设计阶段就有答案。'
      step1: '粘贴真实 Prompt，左侧实时给出字符数、词数、中文字数和 Token 估算。'
      step2: '填入模型的输入、缓存输入、输出单价（美元 / 百万 Token）以及每天调用次数。'
      step3: '看月度成本和缓存节省，决定是否需要压缩 Prompt 或启用前缀缓存。'
      tip: 'Token 估算是本地启发式（英文约 4 字符 / Token，中文约 1.15 Token / 字），与各家真实分词器有几个百分点误差——用来选型足够，对账请以账单为准。'
    sections:
      promptPayload: 提示词内容
      tokenEstimate: Token 估算
      costResult: 成本结果
    placeholders:
      prompt: 粘贴提示词、系统消息、工具 schema 或 RAG 上下文...
    metrics:
      inputTokens: 输入 Token
      characters: 字符数
      words: 单词数
      cjkChars: 中日韩字符
      perCall: 每次调用
      runRate30d: 30 天预计成本
      remainingContext: 剩余上下文
      contextUsage: 上下文
    fields:
      expectedOutputTokens: 预计输出 Token
      callsPerDay: 每日调用次数
      contextWindow: 上下文窗口
      cachedInputHit: 缓存输入命中
      inputPrice: 输入价格（$/百万 Token）
      cachedInputPrice: 缓存输入价格（$/百万）
      outputPrice: 输出价格（$/百万 Token）
