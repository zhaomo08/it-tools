  prompt-template-renderer:
    title: Prompt 模板渲染器
    description: 用 JSON 变量渲染 Prompt 模板，并高亮未解析占位符。
    usage:
      what: '用一份 JSON 变量渲染 Prompt 模板，并把没被替换掉的占位符高亮出来。'
      step1: '左边粘贴模板，右边粘贴 JSON 变量。'
      step2: '看渲染结果，未解析的占位符会被单独标出。'
      step3: '确认没有遗漏后，复制最终 Prompt。'
      tip: '上线前跑一遍能挡掉最常见的一类 Prompt 事故：变量名拼错，导致占位符原样发给了模型。'
    sections:
      template: Prompt 模板
