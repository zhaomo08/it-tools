      step3: '复制 curl 命令，拿到终端复现或直接发给同事。'
      tip: '请求由你的浏览器直接发往服务商，API Key 不经过本站服务器。即便如此，仍建议用测试 Key，不要在公共电脑上填生产 Key。'
