  kv-cache-calculator:
    title: KV Cache 计算器
    description: 估算大模型 KV Cache 显存占用，并计算前缀缓存命中带来的成本节省。
    usage:
      what: '估算长上下文推理时 KV Cache 会吃掉多少显存，以及前缀缓存到底能省多少钱。'
      step1: '选一个模型预设，或手填层数、KV 头数、head_dim 和缓存精度。'
      step2: '填每序列 Token 数和并发序列数，得到总显存占用，以及 24 GiB 显卡能撑多少 Token。'
      step3: '在下方填共享前缀长度和缓存命中率，对比开缓存前后的调用成本。'
      tip: '公式是 层数 × KV 头数 × head_dim × 2(K/V) × 精度字节 × Token 数 × 并发数。GQA / MQA 模型要填 KV 头数而不是注意力头数，填错会高估好几倍。'
    sections:
      kvMemory: KV 内存
      result: 结果
      cacheEconomics: 前缀缓存命中收益
    options:
      presets:
        custom: 自定义 Transformer
        llama8b: Llama 风格 8B GQA
        llama70b: Llama 风格 70B GQA
        dense32: 密集注意力 32 头 x 128
      precision:
        fp16: FP16 / BF16（2 字节）
        fp8: FP8 / INT8（1 字节）
        int4: INT4 / FP4（0.5 字节）
    fields:
      modelPreset: 模型预设
      tokensPerSequence: 每序列 Token 数
      concurrentSequences: 并发序列数
      kvPrecision: KV 精度
      layers: 层数
      kvHeads: KV 头数
      headDim: 头维度
      requests: 请求数
      sharedPrefixTokens: 共享前缀 Token
      variableInputTokens: 可变输入 Token
      outputTokens: 输出 Token
      cacheHit: 缓存命中率
      inputPrice: 输入价格（$/百万）
      cachedPrice: 缓存价格（$/百万）
      outputPrice: 输出价格（$/百万）
    metrics:
      totalKvCache: 总 KV Cache
      perToken: 单 Token 占用
      tokenBudget24: 24 GiB Token 预算
      formula: 层数 x KV 头数 x 头维度 x K/V x 精度 x Token x 序列数
      cachedTokens: 已缓存 Token
      withCache: 启用缓存成本
      savings: 节省金额

