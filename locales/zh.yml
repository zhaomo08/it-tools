  json-output-key-checker:
    title: JSON 输出字段校验器
    description: 校验模型 JSON 输出是否满足必填字段，并标出缺失/多余键。
    usage:
      what: '校验模型返回的 JSON 是否满足约定的必填字段，快速定位结构化输出的失败样本。'
      step1: '每行写一个必填字段名。'
      step2: '粘贴模型返回的 JSON。'
      step3: '看「缺失字段」和「多余字段」两个清单，区分是模型漏了字段还是自己多传了。'
      tip: '适合评测阶段批量过样本。如果失败率偏高，优先改用 structured output / JSON mode，而不是继续在 Prompt 里反复强调格式。'
