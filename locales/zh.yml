  structured-output-builder:
    title: '结构化输出构建器'
    description: '把一份 JSON 样例或 Schema 转成 OpenAI / Anthropic / Gemini 的结构化输出配置，并自动补齐 strict 模式的硬性要求。'
    usage:
      what: '从"我想要模型返回这样的 JSON"直接得到能真正约束住输出的请求配置，三家都支持。'
      step1: '粘贴一段你期望模型返回的 JSON 样例，输入类型保持「JSON 样例」，Schema 会自动推断。'
      step2: '选择目标服务商和 Schema 名称。'
      step3: '复制配置，合并进你的请求体。'
      tip: 'OpenAI 的 strict 模式会拒绝任何"对象允许额外字段"或"存在可选字段"的 Schema。这两项这里会自动补上并列在「Schema 调整」里——可选字段必须改写成可空类型，而不是从 required 里去掉。'
    sections:
      input: '期望输出'
      settings: '构建设置'
      output: '请求配置'
      notes: 'Schema 调整'
    fields:
      mode: '输入类型'
      target: '目标服务商'
      name: 'Schema 名称'
    options:
      sample: 'JSON 样例（自动推断 Schema）'
      schema: 'JSON Schema（直接使用）'
    placeholders:
      input: '粘贴你希望模型返回的 JSON，或一份 JSON Schema……'
      output: '请求配置会显示在这里。'
    actions:
      copy: '复制配置'
    messages:
