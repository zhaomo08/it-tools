      step3: '转成 Gemini 时，务必看一眼底部的「被丢弃的关键字」清单。'
      tip: 'Gemini 只接受 JSON Schema 的一个子集：类型要大写（STRING / OBJECT），不支持 $schema、additionalProperties、$ref、oneOf。可空联合类型会转成 type + nullable，const 会转成单值 enum。'
    sections:
