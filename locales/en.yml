  llm-token-cost-calculator:
    title: LLM token & cost calculator
    description: Estimate local prompt tokens, cached input savings, output cost, and context window usage for LLM calls.
    usage:
      what: 'Estimate the token count and dollar cost of a prompt before you ship it, so "is this affordable at scale" is answered at design time instead of on the invoice.'
      step1: 'Paste a real prompt — characters, words, CJK characters and the token estimate update as you type.'
      step2: 'Enter the model''s input, cached input and output prices per million tokens, plus how many calls you make per day.'
      step3: 'Read the monthly cost and cache savings to decide whether to shorten the prompt or turn on prefix caching.'
      tip: 'The estimate is a local heuristic (~4 characters per token, ~1.15 tokens per CJK character) and lands within a few percent of real tokenizers — good enough to choose a model, not to reconcile a bill.'
    sections:
      promptPayload: Prompt payload
      tokenEstimate: Token estimate
      costResult: Cost result
    placeholders:
      prompt: Paste a prompt, system message, tool schema, or RAG context...
    metrics:
      inputTokens: Input tokens
      characters: Characters
      words: Words
      cjkChars: CJK chars
      perCall: per call
      runRate30d: 30 day run-rate
      remainingContext: Remaining context
      contextUsage: Context
    fields:
      expectedOutputTokens: Expected output tokens
      callsPerDay: Calls per day
      contextWindow: Context window
      cachedInputHit: Cached input hit
      inputPrice: Input $ / 1M tokens
      cachedInputPrice: Cached input $ / 1M
      outputPrice: Output $ / 1M tokens
      batchDiscount: Batch discount

  llm-api-tester:
    title: LLM API tester
    description: Test whether an OpenAI-compatible base URL, API key, and model code are configured correctly.
    usage:
      what: 'Verify that a base_url / api_key / model triple actually works, and get the equivalent curl command.'
      step1: 'Enter the provider''s base URL, API key and model code.'
      step2: 'Send the test message and read back the assistant reply, model name and token usage.'
      step3: 'Copy the curl command to reproduce the call in a terminal or hand it to a teammate.'
      tip: 'The request goes straight from your browser to the provider — the key never touches this site''s server. Even so, prefer a test key and avoid typing a production key on a shared machine.'
    sections:
      connection: Connection
      message: Test message
      result: Result
      curl: curl command
      raw: Raw response
    fields:
      baseUrl: Base URL
      apiKey: API Key
      model: Model code
      endpoint: Endpoint
    placeholders:
      message: Type the message to send...
      raw: The provider response will appear here after the test.
    actions:
      test: Send test request
      copyCurl: Copy curl
    status:
      idle: Ready to test
      success: Configuration OK
      error: Configuration failed
    messages:
      idle: Fill in the provider settings and send the default “你好” test message.
      missingFields: Base URL, API key, model, and message are required.
      invalidJson: The response is not valid JSON.
      noAssistantMessage: No assistant message was found in the response.
      curlCopied: curl copied to clipboard

  kv-cache-calculator:
    title: KV cache calculator
    description: Estimate transformer KV cache memory and prefix cache hit savings for long-context LLM workloads.
    usage:
      what: 'Estimate how much GPU memory the KV cache eats during long-context inference, and what prefix caching actually saves.'
      step1: 'Pick a model preset, or type the layer count, KV head count, head dim and cache precision yourself.'
      step2: 'Set tokens per sequence and concurrent sequences to get total memory and how many tokens fit in 24 GiB.'
      step3: 'Fill in the shared prefix length and cache hit rate below to compare cost with and without prefix caching.'
      tip: 'The formula is layers x KV heads x head dim x 2 (K and V) x precision bytes x tokens x sequences. For GQA/MQA models enter KV heads, not attention heads, or you will overestimate several-fold.'
    sections:
      kvMemory: KV memory
      result: Result
      cacheEconomics: Prefix cache hit economics
    options:
      presets:
        custom: Custom transformer
        llama8b: Llama-style 8B GQA
        llama70b: Llama-style 70B GQA
        dense32: Dense 32 heads x 128
      precision:
        fp16: FP16 / BF16 (2 bytes)
        fp8: FP8 / INT8 (1 byte)
        int4: INT4 / FP4 (0.5 byte)
    fields:
      modelPreset: Model preset
      tokensPerSequence: Tokens per sequence
      concurrentSequences: Concurrent sequences
      kvPrecision: KV precision
      layers: Layers
      kvHeads: KV heads
      headDim: Head dim
      requests: Requests
      sharedPrefixTokens: Shared prefix tokens
      variableInputTokens: Variable input tokens
      outputTokens: Output tokens
      cacheHit: Cache hit
      inputPrice: Input $ / 1M
      cachedPrice: Cached $ / 1M
      outputPrice: Output $ / 1M
    metrics:
      totalKvCache: total KV cache
      perToken: Per token
      tokenBudget24: 24 GiB token budget
      formula: layers x kv heads x head dim x K/V x precision x tokens x sequences
      cachedTokens: Cached tokens
      withCache: With cache
      savings: Savings

  llm-context-planner:
    title: LLM context planner
    description: Plan system prompts, tools, RAG chunks, history, and output reserve against a model context window.
    usage:
      what: 'Treat the context window as a budget and split it deliberately, so chat history does not quietly squeeze out your retrieved passages or the room reserved for the answer.'
      step1: 'Enter the model''s context window size.'
      step2: 'Allocate a token budget to the system prompt, retrieved passages, conversation history and reserved output.'
      step3: 'Watch the remaining budget and the overflow warning, then rebalance until the answer still has room.'
      tip: 'Reserve generous output space — most "the answer got cut off" reports are an output reservation that was too small, not an input that was too long.'
    status:
      overBudget: Over budget
      tight: Tight
      healthy: Healthy
    sections:
      contextBudget: Context budget
      fitCheck: Fit check
      breakdown: Breakdown
    fields:
      contextWindow: Context window
      systemPrompt: System prompt
      toolSchemas: Tool schemas
      conversationHistory: Conversation history
      ragChunkTokens: RAG chunk tokens
      ragChunks: RAG chunks
      userTurn: User turn
      outputReserve: Output reserve
      safetyReserve: Safety reserve
    metrics:
      used: Used
      remaining: Remaining
      ragBudget: RAG budget
      chunks: chunks
    breakdown:
      system: System
      tools: Tools
      history: History
      rag: RAG
      output: Output
      free: Free

