      what: 'Convert a chat request body between OpenAI, Anthropic and Gemini so switching providers is not a manual rewrite.'
      step1: 'Paste any of the three shapes — the detected source format shows in the top right.'
      step2: 'Pick the target format and model code.'
      step3: 'Copy the result straight into your request.'
      tip: 'The three providers disagree about the system prompt — OpenAI puts it in messages, Anthropic uses a top-level system field, Gemini calls it systemInstruction. It is moved for you, and the assistant/model role name is swapped to match.'
