    title: LLM stream parser
    description: Reassemble a streamed SSE response from OpenAI, Anthropic, or Gemini into readable text, tool arguments, and usage.
    usage:
      what: 'Reassemble a raw SSE stream into readable text while seeing the chunk count, usage and finish reason.'
      step1: 'Paste the raw stream exactly as captured — data: prefixes and event: lines are both fine.'
      step2: 'Read the chunk count, model, finish_reason, usage and whether the done marker arrived on the right.'
      step3: 'Take the assembled text below; reasoning content and tool-call arguments get their own panels.'
      tip: 'Understands OpenAI chat/responses, Anthropic messages and Gemini chunk shapes. Payloads that fail to parse are listed by index, which is the fastest way to spot a truncated connection.'
