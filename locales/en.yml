about:
  content: >
    # About IT-Tools

    This is a fork of [CorentinTh/it-tools](https://github.com/CorentinTh/it-tools), with an added **AI toolset** designed for LLM workflows. All original tools are preserved, and new AI-specific tools are available under the AI category.

    ## AI Tools

    - **LLM Token & Cost Calculator** — Estimate token count, cache savings, and call cost locally
    - **LLM API Tester** — Test OpenAI-compatible model endpoint settings with a real chat completion request
    - **KV Cache Calculator** — Estimate VRAM usage and prefix-cache benefit for Transformer models
    - **LLM Context Planner** — Plan context window allocation across system prompt, RAG, history, and output
    - **Prompt Variable Extractor** — Extract double-brace placeholders from templates and generate JSON samples
    - **Prompt Template Renderer** — Render prompt templates with JSON variables, highlight unresolved placeholders
    - **JSONL Chat Builder** — Convert multi-line prompts to chat-completion JSONL batch requests
    - **JSON Output Key Checker** — Validate that model JSON output satisfies required fields

    ## Technologies

    Built with Vue.js (Vue 3), Naive UI, and Vite. Hosted and continuously deployed by Vercel. Source code on [GitHub](https://github.com/zhaomo08/it-tools).

    ## Found a bug? A tool is missing?

    Submit a feature request or bug report in the [issues section](https://github.com/zhaomo08/it-tools/issues/new/choose) on GitHub.

    ## Credits

    Original project by [Corentin Thomasset](https://corentin.tech), licensed under GPL-3.0.

