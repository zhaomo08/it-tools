  tool-schema-converter:
    title: Tool schema converter
    description: Convert function calling tool definitions between OpenAI, Anthropic, and Gemini, flagging JSON Schema keywords Gemini drops.
    usage:
      what: 'Convert function calling tool definitions between the three providers and see which JSON Schema keywords Gemini throws away.'
      step1: 'Paste OpenAI tools, Anthropic tools, or Gemini functionDeclarations.'
      step2: 'Choose the target format — the detected tool count shows on the right.'
      step3: 'When targeting Gemini, read the dropped-keywords list at the bottom before shipping.'
      tip: 'Gemini takes only a subset of JSON Schema: types are uppercase (STRING/OBJECT), and $schema, additionalProperties, $ref and oneOf are unsupported. A nullable union becomes type + nullable, and const becomes a single-value enum.'
