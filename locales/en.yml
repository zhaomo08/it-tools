  rag-text-chunker:
    title: RAG text chunker
    description: Split a document into embedding-ready chunks on semantic boundaries, with overlap and per-chunk token estimates.
    usage:
      what: 'Split a long document into embedding-ready chunks and preview exactly where every boundary lands.'
      step1: 'Paste the document, then set max characters per chunk and the overlap on the right.'
      step2: 'Scan the per-chunk preview below to confirm no semantic unit was cut in half.'
      step3: 'Hit Copy JSONL for embedding input with an id and source on every chunk.'
      tip: 'Boundaries are tried in order — paragraph, line, sentence end (CJK and Latin), space, then a hard cut. An overlap of 10-15% of the chunk size keeps sentences that straddle a boundary retrievable from both sides.'
    sections:
      source: Source Document
