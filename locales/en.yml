      step3: 'Copy the configuration and merge it into your request body.'
      tip: 'OpenAI strict mode rejects any schema where an object allows extra properties or leaves a key optional. Those two fixes are applied for you and listed under Schema Adjustments — an optional field has to become a nullable type instead.'
